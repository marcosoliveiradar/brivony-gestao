name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    name: Build e testes (Python 3.12 + PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brivony
          POSTGRES_PASSWORD: brivony
          POSTGRES_DB: brivony
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brivony"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: chave-somente-para-o-ci
      DJANGO_DEBUG: "False"
      DATABASE_URL: postgres://brivony:brivony@localhost:5432/brivony

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Verificar configuração do Django
        run: python manage.py check --deploy --fail-level ERROR

      - name: Verificar migrações pendentes
        run: python manage.py makemigrations --check --dry-run

      - name: Coletar arquivos estáticos (build)
        run: python manage.py collectstatic --noinput

      - name: Rodar testes unitários e de integração com cobertura
        run: |
          coverage run manage.py test loja --verbosity 2
          coverage report --fail-under=85
          coverage xml

      - name: Publicar relatório de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura
          path: coverage.xml
