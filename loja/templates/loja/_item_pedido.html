{% load loja_tags %}
<div class="cartao mb-2 item-pedido{% if f.quantidade.errors or f.produto.errors %} cartao-erro{% endif %}" data-item>
  <label class="form-label" for="{{ f.produto.id_for_label }}">Peça</label>
  <select class="form-select" name="{{ f.produto.html_name }}" id="{{ f.produto.id_for_label }}" data-produto
          {% if f.produto.errors %}aria-invalid="true"{% endif %}>
    <option value="">Escolha a peça</option>
    {% for p in produtos %}
      <option value="{{ p.pk }}" data-preco="{{ p.preco|stringformat:'s' }}" data-disp="{{ p.quantidade_estoque }}"
              data-tam="{{ p.get_tamanho_display }}" data-busca="{{ p.nome|lower }} {{ p.cor|lower }}"
              {% if f.produto.value|stringformat:'s' == p.pk|stringformat:'s' %}selected{% endif %}>
        {{ p.nome }} · Tam. {{ p.get_tamanho_display }} · {{ p.cor }} · {{ p.preco|brl }}
      </option>
    {% endfor %}
  </select>
  {% for e in f.produto.errors %}<div class="erro-campo"><i class="bi bi-x-circle-fill" aria-hidden="true"></i> {{ e }}</div>{% endfor %}

  <div class="d-flex justify-content-between align-items-center mt-2 flex-wrap gap-2">
    <span class="texto-suave">Disponível: <span data-disp-texto>–</span></span>
    <div class="contador">
      <button type="button" data-menos aria-label="Diminuir quantidade">−</button>
      <label class="visually-hidden" for="{{ f.quantidade.id_for_label }}">Quantidade</label>
      <input class="form-control" type="number" min="1" inputmode="numeric" name="{{ f.quantidade.html_name }}"
             id="{{ f.quantidade.id_for_label }}" value="{{ f.quantidade.value|default:1 }}" data-qtd
             {% if f.quantidade.errors %}aria-invalid="true"{% endif %} aria-describedby="{{ f.prefix }}-erro">
      <button type="button" data-mais aria-label="Aumentar quantidade">+</button>
    </div>
  </div>
  <div id="{{ f.prefix }}-erro" class="mt-2" aria-live="polite" data-erro>
    {% for e in f.quantidade.errors %}
      <div class="alert alerta alerta-error mb-0"><i class="bi bi-x-circle-fill" aria-hidden="true"></i><span>{{ e }}</span></div>
    {% endfor %}
  </div>
  <button type="button" class="btn btn-link px-0 mt-1" data-remover>Remover peça</button>
</div>
