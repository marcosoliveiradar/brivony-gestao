{% extends "base.html" %}
{% block title %}Entrar · Brivony Gestão{% endblock %}
{% block content %}
<h1 class="h3 mb-3">Entrar</h1>
<p>Use seu usuário e senha para acessar o sistema.</p>
{% if form.non_field_errors %}
  <div class="alert alerta alerta-error" role="alert"><i class="bi bi-x-circle-fill" aria-hidden="true"></i>
    <span>Usuário ou senha incorretos. Confira e tente de novo.</span></div>
{% endif %}
<form method="post" novalidate>
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ next }}">
  <div class="mb-3">
    <label class="form-label" for="id_username">Usuário</label>
    <input class="form-control" type="text" name="username" id="id_username" autocomplete="username" required autofocus value="{{ form.username.value|default:'' }}">
  </div>
  <div class="mb-3">
    <label class="form-label" for="id_password">Senha</label>
    <input class="form-control" type="password" name="password" id="id_password" autocomplete="current-password" required>
  </div>
  <button type="submit" class="btn btn-principal w-100">Entrar</button>
</form>
{% endblock %}
